{% extends "base.html" %}

{% block content %}
<div class="mb-8">
    <h1 class="text-2xl font-bold text-gray-900">Upload Meeting Recording</h1>
    <p class="text-gray-500">Add a new audio file for transcription and AI analysis.</p>
</div>

<div class="max-w-3xl mx-auto">
    <div class="bg-white shadow sm:rounded-lg border border-gray-200">
        <div class="px-4 py-5 sm:p-6">
            <form action="{{ url_for('main.upload') }}" method="POST" enctype="multipart/form-data" class="space-y-6">
                <div class="grid grid-cols-1 gap-y-6 gap-x-4 sm:grid-cols-6">
                    <div class="sm:col-span-4">
                        <label for="title" class="block text-sm font-medium text-gray-700">Meeting Title</label>
                        <div class="mt-1">
                            <input type="text" name="title" id="title" required class="shadow-sm focus:ring-blue-500 focus:border-blue-500 block w-full sm:text-sm border-gray-300 rounded-md p-2 border" placeholder="City Council Regular Meeting">
                        </div>
                    </div>

                    <div class="sm:col-span-2">
                        <label for="meeting_date" class="block text-sm font-medium text-gray-700">Meeting Date</label>
                        <div class="mt-1">
                            <input type="date" name="meeting_date" id="meeting_date" required class="shadow-sm focus:ring-blue-500 focus:border-blue-500 block w-full sm:text-sm border-gray-300 rounded-md p-2 border">
                        </div>
                    </div>

                    <div class="sm:col-span-6">
                        <label for="youtube_url" class="block text-sm font-medium text-gray-700">YouTube URL (Optional)</label>
                        <div class="mt-1 flex rounded-md shadow-sm">
                            <input type="url" name="youtube_url" id="youtube_url" class="focus:ring-blue-500 focus:border-blue-500 flex-1 block w-full rounded-none rounded-l-md sm:text-sm border-gray-300 p-2 border" placeholder="https://www.youtube.com/watch?v=...">
                            <button type="button" id="fetch_info" class="inline-flex items-center px-3 rounded-r-md border border-l-0 border-gray-300 bg-gray-50 text-gray-500 text-sm hover:bg-gray-100">
                                Fetch Details
                            </button>
                        </div>
                        <p class="mt-1 text-xs text-gray-500">Paste a YouTube URL to download audio and automatically fill details.</p>
                    </div>

                    <div class="sm:col-span-6">
                        <label class="block text-sm font-medium text-gray-700">Audio File</label>
                        <div class="mt-1 flex justify-center px-6 pt-5 pb-6 border-2 border-gray-300 border-dashed rounded-md hover:border-blue-400 transition-colors">
                            <div class="space-y-1 text-center">
                                <svg class="mx-auto h-12 w-12 text-gray-400" stroke="currentColor" fill="none" viewBox="0 0 48 48" aria-hidden="true">
                                    <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                                </svg>
                                <div class="flex text-sm text-gray-600">
                                    <label for="audio_file" class="relative cursor-pointer bg-white rounded-md font-medium text-blue-600 hover:text-blue-500 focus-within:outline-none focus-within:ring-2 focus-within:ring-offset-2 focus-within:ring-blue-500">
                                        <span>Upload a file</span>
                                        <input id="audio_file" name="audio_file" type="file" class="sr-only" accept=".mp3,.wav,.m4a">
                                    </label>
                                    <p class="pl-1">or drag and drop</p>
                                </div>
                                <p class="text-xs text-gray-500">MP3, WAV, M4A up to 500MB</p>
                            </div>
                        </div>
                        <p id="file-name" class="mt-2 text-sm text-blue-600 font-medium"></p>
                    </div>
                </div>

                <div class="pt-4">
                    <button type="submit" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                        Start Processing
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    const audioFileInput = document.getElementById('audio_file');
    const youtubeUrlInput = document.getElementById('youtube_url');
    const titleInput = document.getElementById('title');
    const dateInput = document.getElementById('meeting_date');
    const fileNameDisplay = document.getElementById('file-name');
    const fetchInfoBtn = document.getElementById('fetch_info');

    audioFileInput.onchange = function () {
        if (this.files.length > 0) {
            const file = this.files[0];
            fileNameDisplay.textContent = 'Selected: ' + file.name;
            
            // Try to extract date and title from filename
            // Expected patterns: YYYYMMDD_Title.mp3, YYYY-MM-DD_Title.mp3, or Title_YYYYMMDD.mp3
            const name = file.name.replace(/\.[^/.]+$/, ""); // remove extension
            
            // Look for date pattern (YYYY-MM-DD or YYYYMMDD)
            const dateMatch = name.match(/(\d{4}-\d{2}-\d{2})|(\d{8})/);
            if (dateMatch) {
                let foundDate = dateMatch[0];
                if (foundDate.length === 8) {
                    foundDate = foundDate.substring(0, 4) + '-' + foundDate.substring(4, 6) + '-' + foundDate.substring(6, 8);
                }
                dateInput.value = foundDate;
                
                // Remove the date from the name to get a cleaner title
                let cleanTitle = name.replace(dateMatch[0], '').replace(/[_-]/g, ' ').trim();
                if (cleanTitle) {
                    titleInput.value = cleanTitle;
                }
            } else {
                // Just use the filename as title if no date found
                titleInput.value = name.replace(/[_-]/g, ' ').trim();
            }
        }
    };

    fetchInfoBtn.onclick = async function() {
        const url = youtubeUrlInput.value;
        if (!url) return;

        fetchInfoBtn.disabled = true;
        fetchInfoBtn.textContent = 'Fetching...';

        try {
            const response = await fetch('{{ url_for("main.fetch_youtube_info") }}', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ url: url })
            });

            const data = await response.json();
            if (data.title) titleInput.value = data.title;
            if (data.date) dateInput.value = data.date;
            
            if (data.error) {
                alert('Error: ' + data.error);
            }
        } catch (error) {
            console.error('Error fetching YouTube info:', error);
            alert('Failed to fetch YouTube info');
        } finally {
            fetchInfoBtn.disabled = false;
            fetchInfoBtn.textContent = 'Fetch Details';
        }
    };
</script>
{% endblock %}
